# ---------------------------------------------------------------------------
# SonarQube static analysis — ACEest Fitness & Gym
# Used by the "SonarQube Analysis" stage in the Jenkinsfile.
# ---------------------------------------------------------------------------
sonar.projectKey=aceest-fitness
sonar.projectName=ACEest Fitness & Gym
sonar.projectVersion=2.0

sonar.sources=app.py,core.py,db.py,report.py
sonar.tests=test_app.py
sonar.language=py
sonar.python.version=3.14
sonar.sourceEncoding=UTF-8

# Reports produced by the Jenkins "Unit Tests" stage
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml
