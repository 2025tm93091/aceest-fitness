# A/B TESTING (NGINX Ingress header / cookie routing)
# Everyone gets version A, except requests that carry
#   header  X-Variant: B     or   cookie  ab_variant_b=always
# which are routed to version B. Lets the business compare two versions
# for a chosen user segment instead of a random percentage.
# Requires: minikube addons enable ingress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-version-a
  namespace: aceest
  labels:
    app: aceest-ab
    version: a
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: aceest-ab
      version: a
  template:
    metadata:
      labels:
        app: aceest-ab
        version: a
    spec:
      containers:
        - name: app
          image: DOCKERHUB_USER/aceest-fitness:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: APP_VARIANT
              value: "A"
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-version-b
  namespace: aceest
  labels:
    app: aceest-ab
    version: b
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: aceest-ab
      version: b
  template:
    metadata:
      labels:
        app: aceest-ab
        version: b
    spec:
      containers:
        - name: app
          image: DOCKERHUB_USER/aceest-fitness:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: APP_VARIANT
              value: "B"
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-version-a
  namespace: aceest
spec:
  type: ClusterIP
  selector:
    app: aceest-ab
    version: a
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-version-b
  namespace: aceest
spec:
  type: ClusterIP
  selector:
    app: aceest-ab
    version: b
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ab-a
  namespace: aceest
spec:
  ingressClassName: nginx
  rules:
    - host: ab.aceest.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-version-a
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ab-b
  namespace: aceest
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: "X-Variant"
    nginx.ingress.kubernetes.io/canary-by-header-value: "B"
    nginx.ingress.kubernetes.io/canary-by-cookie: "ab_variant_b"
spec:
  ingressClassName: nginx
  rules:
    - host: ab.aceest.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-version-b
                port:
                  number: 80
