# BLUE-GREEN
# Two full environments run side by side. The Service selector decides which
# one is live. Switch to green: kubectl -n aceest patch service aceest-bluegreen -p '{"spec":{"selector":{"app":"aceest-bg","color":"green"}}}'
# Roll back = patch the selector back to blue (instant, no redeploy).
# Endpoint:  minikube service aceest-bluegreen -n aceest --url
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  namespace: aceest
  labels:
    app: aceest-bg
    color: blue
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: aceest-bg
      color: blue
  template:
    metadata:
      labels:
        app: aceest-bg
        color: blue
    spec:
      containers:
        - name: app
          image: DOCKERHUB_USER/aceest-fitness:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: APP_VARIANT
              value: "blue"
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
  namespace: aceest
  labels:
    app: aceest-bg
    color: green
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: aceest-bg
      color: green
  template:
    metadata:
      labels:
        app: aceest-bg
        color: green
    spec:
      containers:
        - name: app
          image: DOCKERHUB_USER/aceest-fitness:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: APP_VARIANT
              value: "green"
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-bluegreen
  namespace: aceest
spec:
  type: NodePort
  selector:
    app: aceest-bg
    color: blue
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-green-preview
  namespace: aceest
spec:
  type: ClusterIP
  selector:
    app: aceest-bg
    color: green
  ports:
    - port: 80
      targetPort: 5000
