# ---------------------------------------------------------------------------
# ACEest Fitness — GitHub Actions CI/CD Pipeline
# ---------------------------------------------------------------------------
# Runs on every push and pull request to main/develop.
# Stages: lint → test → docker build → container smoke test
# ---------------------------------------------------------------------------

name: ACEest CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Lint + Test on the host runner
  # -------------------------------------------------------------------------
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          allow-prereleases: true

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 app.py core.py db.py report.py test_app.py --max-line-length=100

      - name: Run pytest with coverage
        run: |
          pytest -v --cov=core --cov=db --cov=report --cov=app --cov-report=term-missing

  # -------------------------------------------------------------------------
  # Job 2: Build Docker image, then run tests inside the container
  # -------------------------------------------------------------------------
  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: aceest-fitness:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

            - name: Run tests inside container
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            -e ACEEST_DB_PATH=/tmp/aceest_test.db \
            aceest-fitness:ci \
            sh -c "pip install pytest pytest-cov && pytest -v"
            
      - name: Start container and check health
        run: |
          docker run -d --name aceest-ci -p 5000:5000 aceest-fitness:ci
          sleep 10
          curl -sf http://localhost:5000/health
          curl -sf http://localhost:5000/
          docker logs aceest-ci
          docker stop aceest-ci